changelog: >-
  1.0.3.0 Make button placement adaptive: search several detail-page containers
  with a header fallback, re-check during client re-renders, and log a DOM probe
  so the active container can be identified.

  1.0.2.0 Bypass browser/service worker caching of the client script: add a
  version query to the injected tag and no-store cache headers.

  1.0.1.0 Fix download button injection for Jellyfin 10.11: place the button in
  the main detail button row and stop depending on legacy api client helpers.

  1.0.0.0 Initial release