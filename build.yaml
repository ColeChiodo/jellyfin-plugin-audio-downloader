version: "1.0.6.0"
targetAbi: "10.11.0.0"
framework: "net9.0"
overview: "Download a compressed audio track of a movie or show with intros, outros and dead air removed."
description: >
  Adds a "Download Audio" button to the web client for movies, episodes, seasons
  and series. The rendered track has detected intro, outro, commercial and preview
  segments cut (via Jellyfin media segments as produced by the Intro Skipper plugin)
  and long silent periods removed. Output can be MP3 or M4A/AAC and the audio track
  can be chosen when multiple languages are present.
category: "General"
owner: "jellyfin"
artifacts:
- "Jellyfin.Plugin.AudioDownloader.dll"
changelog: >-
  1.0.6.0 Fix every download failing with "No process is associated with this
  object" by reading the ffmpeg exit code before the process object is disposed.

  1.0.5.0 Keep the download button after client navigation: re-query the detail
  container after resolving the item (previously appended to a detached node
  after React swapped the view, hiding the button). Download via fetch so the
  server's error is reported instead of silently failing.

  1.0.4.0 Continuously observe the route and DOM instead of listening only for
  #/details routes: log every route change plus the top element classes on item
  pages so the real detail page structure is always visible.

  1.0.3.0 Make button placement adaptive: search several detail-page containers
  with a header fallback, re-check during client re-renders, and log a DOM probe
  so the active container can be identified.

  1.0.2.0 Bypass browser/service worker caching of the client script: add a
  version query to the injected tag and no-store cache headers.

  1.0.1.0 Fix download button injection for Jellyfin 10.11: place the button in
  the main detail button row and stop depending on legacy api client helpers.

  1.0.0.0 Initial release