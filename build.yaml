framework: "net9.0"
overview: "Download a compressed audio track of a movie or show with intros, outros and dead air removed."
description: >
  Adds a "Download Audio" button to the web client for movies, episodes, seasons
  and series. The rendered track has detected intro, outro, commercial and preview
  segments cut (via Jellyfin media segments as produced by the Intro Skipper plugin)
  and long silent periods removed. Output can be MP3 or M4A/AAC and the audio track
  can be chosen when multiple languages are present.
category: "General"
